spring:
  application:
    name: tomato-companion-server
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-before-production-0123456789}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:1200}
    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:2592000}
  security:
    login-rate-limit: ${LOGIN_RATE_LIMIT:10}
    invite-rate-limit: ${INVITE_RATE_LIMIT:20}
    rate-limit-fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
